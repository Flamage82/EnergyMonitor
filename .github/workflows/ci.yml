name: CI

# Runs on every push and PR so a Worker-side change cannot merge green-but-broken.
# Deployment stays in deploy.yml (push to main only).
on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
        env:
          # Compile-check only — the real value is injected by deploy.yml. vite
          # fails the build if this is unset (see app/vite.config.ts).
          VITE_WORKER_URL: https://ci-placeholder.invalid

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
